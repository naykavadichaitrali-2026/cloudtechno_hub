
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Website Provisioning and Scaling</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #dbeafe, #bfdbfe);
            padding: 30px;
        }

        .box {
            background: white;
            padding: 35px;
            border-radius: 15px;
            max-width: 650px;
            margin: 50px auto;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            color: #1e40af;
        }

        h3 {
            color: #334155;
            margin: 20px;
        }

        button {
            padding: 13px 20px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #2563eb;
            color: white;
            font-size: 15px;
        }

        button:hover {
            background: #1e40af;
        }

        #servers {
            margin: 25px;
            font-size: 18px;
            color: green;
            font-weight: bold;
        }

        .server {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 15px;
            margin: 8px;
            border-radius: 10px;
            border: 2px solid #3b82f6;
        }

        #status {
            color: #15803d;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Website Provisioning and Scaling</h1>

        <h3 id="status">Status: Not Provisioned</h3>

        <h3 id="capacity">Server Capacity: 0 servers</h3>

        <div id="servers">
            No servers running
        </div>

        <button onclick="provision()">
            Provision Website
        </button>

        <button onclick="scale()">
            Scale to 3 Servers
        </button>

        <button onclick="resetDemo()">
            Reset
        </button>

    </div>

    <script>

        let serverCount = 0;

        function provision() {

            serverCount = 1;

            document.getElementById("status").innerText =
                "Status: Website Provisioned";

            updateDisplay();
        }

        function scale() {

            if (serverCount === 0) {
                alert("Provision the website first!");
                return;
            }

            serverCount = 3;

            document.getElementById("status").innerText =
                "Status: Website Scaled Successfully";

            updateDisplay();
        }

        function updateDisplay() {

            document.getElementById("capacity").innerText =
                "Server Capacity: " + serverCount + " servers";

            let output = "";

            for (let i = 1; i <= serverCount; i++) {

                output +=
                    '<div class="server">Server ' + i + '</div>';

            }

            document.getElementById("servers").innerHTML = output;
        }

        function resetDemo() {

            serverCount = 0;

            document.getElementById("status").innerText =
                "Status: Not Provisioned";

            document.getElementById("capacity").innerText =
                "Server Capacity: 0 servers";

            document.getElementById("servers").innerText =
                "No servers running";
        }

    </script>

</body>
</html>
